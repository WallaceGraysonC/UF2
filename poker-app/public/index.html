<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hold'em — free, ad-free poker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1>♠ Hold'em</h1>
      <p class="tagline">No ads. No pop-ups. No purchases. Just poker.</p>
      <form id="auth-form">
        <input id="auth-username" type="text" placeholder="Username" autocomplete="username" required />
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" id="auth-submit">Log in</button>
      </form>
      <p class="auth-toggle">
        <span id="auth-toggle-text">New here?</span>
        <a href="#" id="auth-toggle-link">Create an account</a>
      </p>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <div id="lobby-screen" class="screen hidden">
    <header class="topbar">
      <div class="brand">♠ Hold'em</div>
      <div class="account-bar">
        <span id="account-name"></span>
        <span class="chip-pill">🪙 <span id="account-balance">0</span></span>
        <button id="open-shop">Shop</button>
        <button id="logout-btn">Log out</button>
      </div>
    </header>
    <main class="lobby-main">
      <h2>Tables</h2>
      <div id="table-list" class="table-list"></div>
    </main>
  </div>

  <div id="table-screen" class="screen hidden">
    <header class="topbar">
      <button id="leave-table-btn">&larr; Lobby</button>
      <div id="table-title"></div>
      <span class="chip-pill">🪙 <span id="account-balance-2">0</span></span>
    </header>
    <div class="felt" id="felt">
      <div class="board">
        <div id="community-cards" class="community-cards"></div>
        <div id="pot-display" class="pot-display"></div>
      </div>
      <div id="seats" class="seats"></div>
    </div>
    <div id="action-bar" class="action-bar hidden">
      <input id="raise-amount" type="range" min="0" max="0" value="0" />
      <span id="raise-amount-label">0</span>
      <button id="act-fold" class="act-btn fold">Fold</button>
      <button id="act-check" class="act-btn check">Check</button>
      <button id="act-call" class="act-btn call">Call</button>
      <button id="act-raise" class="act-btn raise">Raise</button>
      <button id="act-allin" class="act-btn allin">All-In</button>
    </div>
    <div id="hand-log" class="hand-log"></div>
  </div>

  <div id="shop-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Cosmetics Shop</h2>
        <button id="close-shop">&times;</button>
      </div>
      <p class="shop-note">Chips here are just for show — earned at the tables, never for sale.</p>
      <div id="shop-items" class="shop-items"></div>
    </div>
  </div>

  <div id="buyin-modal" class="modal hidden">
    <div class="modal-content small">
      <h2>Take a seat</h2>
      <p id="buyin-range-label"></p>
      <input id="buyin-amount" type="range" min="0" max="0" value="0" />
      <div id="buyin-amount-label"></div>
      <button id="confirm-buyin">Sit down</button>
      <button id="cancel-buyin" class="secondary">Cancel</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
