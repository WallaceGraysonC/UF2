name: SecondSpinSim
options:
  bundleIdPrefix: com.graysonwallace
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  SecondSpinSim:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graysonwallace.secondspinsim
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Second Spin Sim"
