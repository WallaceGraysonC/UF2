name: SecondSpinSim
options:
  bundleIdPrefix: com.graysonwallace
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  SecondSpinSim:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graysonwallace.secondspinsim
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: "Second Spin Sim"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
